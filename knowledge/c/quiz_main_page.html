<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Yarışması</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 90%;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .team-selection {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .team-option {
            text-align: center;
            background: white;
            border-radius: 15px;
            padding: 25px;
            border: 3px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 200px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .team-option:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .team-option.team-a {
            border-color: #ff6b6b;
        }

        .team-option.team-a:hover {
            background: linear-gradient(45deg, #ff6b6b15, #ee5a5215);
        }

        .team-option.team-b {
            border-color: #4ecdc4;
        }

        .team-option.team-b:hover {
            background: linear-gradient(45deg, #4ecdc415, #44a08d15);
        }

        .team-name-big {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .team-option.team-a .team-name-big {
            color: #ff6b6b;
        }

        .team-option.team-b .team-name-big {
            color: #4ecdc4;
        }

        .player-count {
            font-size: 1.8em;
            font-weight: bold;
            color: #666;
            margin-bottom: 10px;
        }

        .player-count-label {
            font-size: 1em;
            color: #888;
        }

        .game-area {
            display: none;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
        }

        .team-info {
            text-align: center;
        }

        .team-name {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .team-score {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .timer-section {
            text-align: center;
        }

        .timer {
            font-size: 3em;
            font-weight: bold;
            color: #e74c3c;
            text-align: center;
            animation: pulse 1s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .question-area {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            min-height: 300px;
        }

        .question {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option {
            padding: 15px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            text-align: center;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-1px);
        }

        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option.correct {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }

        .option.incorrect {
            background: #e74c3c;
            color: white;
            border-color: #e74c3c;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #95a5a6, #7f8c8d);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .waiting {
            text-align: center;
            padding: 40px;
        }

        .waiting h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .player-list {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }

        .team-list {
            flex: 1;
            margin: 0 20px;
        }

        .team-list h3 {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            color: white;
        }

        .team-list.team-a h3 {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
        }

        .team-list.team-b h3 {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }

        .player {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            margin: 5px 0;
            text-align: center;
        }

        .game-finished {
            text-align: center;
            padding: 40px;
        }

        .winner {
            font-size: 2.5em;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 20px;
        }

        .final-scores {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }

        .final-score {
            font-size: 1.5em;
            padding: 20px;
            border-radius: 10px;
            background: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Quiz Yarışması</h1>
        
        <div id="teamSelection" class="team-selection">
            <div class="team-option team-a" onclick="selectTeam('A')">
                <div class="team-name-big">TAKIM A</div>
                <div class="player-count" id="teamACount">2/0</div>
                <div class="player-count-label">oyuncu</div>
            </div>
            <div class="team-option team-b" onclick="selectTeam('B')">
                <div class="team-name-big">TAKIM B</div>
                <div class="player-count" id="teamBCount">2/0</div>
                <div class="player-count-label">oyuncu</div>
            </div>
        </div>
        <div class="controls" style="margin-top: 0; margin-bottom: 30px; justify-content: center;">
             <button class="btn btn-secondary" onclick="resetGame()">Oyunu Sıfırla</button>
        </div>

        <div class="waiting" id="waitingArea" style="display: none;">
            <h2>Oyuncular bekleniyor... <span id="readyPlayerCount">0</span>/<span id="currentPlayerCount">0</span> oyuncu hazır.</h2>
            <p>Tüm oyuncular hazır olduğunda oyun başlayacak.</p>
            
            <div class="player-list">
                <div class="team-list team-a">
                    <h3>Takım A (2/<span id="teamAWaitCount">0</span>)</h3>
                    <div id="teamAPlayers"></div>
                </div>
                <div class="team-list team-b">
                    <h3>Takım B (2/<span id="teamBWaitCount">0</span>)</h3>
                    <div id="teamBPlayers"></div>
                </div>
            </div>
            
            <div class="controls">
                <button id="readyBtn" class="btn btn-primary" onclick="setReady()">I'm Ready</button>
                <button class="btn btn-secondary" onclick="resetGame()">Oyunu Sıfırla</button>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="game-info">
                <div class="team-info">
                    <div class="team-name" style="color: #ff6b6b;">Takım A</div>
                    <div class="team-score" id="teamAScore">0</div>
                </div>
                <div class="timer-section">
                    <div class="timer" id="timer">60</div>
                    <div id="currentTeamIndicator" style="text-align: center; margin-top: 10px; font-weight: bold;">Sıra: Takım A</div>
                </div>
                <div class="team-info">
                    <div class="team-name" style="color: #4ecdc4;">Takım B</div>
                    <div class="team-score" id="teamBScore">0</div>
                </div>
            </div>

            <div class="question-area" id="questionArea">
                <!-- Question content will be loaded here -->
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="submitAnswerBtn" onclick="submitAnswer()" style="display: none;">Cevabı Onayla</button>
            </div>
        </div>

        <div class="game-finished" id="gameFinished" style="display: none;">
            <div class="winner" id="winnerText">TAKIM A KAZANDI! 🎉</div>
            <div class="final-scores">
                <div class="final-score" id="finalScoreA">Takım A: 0</div>
                <div class="final-score" id="finalScoreB">Takım B: 0</div>
            </div>
            <div class="controls">
                <button class="btn btn-primary" onclick="resetGame()">Yeni Oyun</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let currentGame = null;
        let selectedAnswer = null;
        let gameState = 'waiting';
        let eventSource = null;
        let timeRemaining = 60;
        let timerInterval = null;
        let userPosition = -1;
        let lastQuestionId = -1;

        // Start SSE connection
        function startSSE() {
            eventSource = new EventSource('sse_events.php');
            
            eventSource.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleSSEMessage(data);
            };
            
            eventSource.onerror = function(event) {
                console.log('SSE Error:', event);
                setTimeout(startSSE, 5000); // Reconnect after 5 seconds
            };
        }

        function handleSSEMessage(data) {
            switch(data.type) {
                case 'game_update':
                    updateGameState(data.data);
                    break;
                case 'timer_update':
                    updateTimer(data.data.time_remaining);
                    break;
            }
        }

        function updateGameState(state) {
            if (state.game) {
                const oldGame = currentGame;
                currentGame = state.game;

                updateTeamCounts(state.teams, state.ready_player_count);
                updatePlayerList(currentGame.users);
                
                if (currentGame.status === 'active' && gameState !== 'playing') {
                    startGame();
                }

                if (gameState === 'playing' && oldGame && currentGame.current_question_id !== oldGame.current_question_id) {
                    displayQuestion();
                    startTimer();
                }

                if (currentGame.show_answer == 1 && (!oldGame || oldGame.show_answer == 0)) {
                    showCorrectAnswer();
                }

                if (currentGame.status === 'finished' && gameState !== 'finished') {
                    endGame();
                }
            } else {
                updateTeamCounts(state.teams, state.ready_player_count);
                updatePlayerList([]);
            }
        }

        function updateTeamCounts(teams, readyPlayerCount) {
            document.getElementById('teamACount').textContent = '2/' + (teams.A || 0);
            document.getElementById('teamBCount').textContent = '2/' + (teams.B || 0);
            document.getElementById('teamAWaitCount').textContent = teams.A || 0;
            document.getElementById('teamBWaitCount').textContent = teams.B || 0;
            const totalPlayers = (teams.A || 0) + (teams.B || 0);
            document.getElementById('currentPlayerCount').textContent = totalPlayers;
            document.getElementById('readyPlayerCount').textContent = readyPlayerCount || 0;
        }

        function updatePlayerList(users) {
            const teamAPlayers = document.getElementById('teamAPlayers');
            const teamBPlayers = document.getElementById('teamBPlayers');
            
            teamAPlayers.innerHTML = '';
            teamBPlayers.innerHTML = '';
            
            if (!users) return;

            let currentUserIsReady = false;

            users.forEach((user) => {
                const playerDiv = document.createElement('div');
                playerDiv.className = 'player';
                
                let readyIndicator = user.status === 'ready' ? '✅' : '...';
                playerDiv.textContent = `${user.username} ${readyIndicator}`;
                
                if (user.team === 'A') {
                    teamAPlayers.appendChild(playerDiv);
                } else {
                    teamBPlayers.appendChild(playerDiv);
                }

                if (currentUser && user.id === currentUser.id && user.status === 'ready') {
                    currentUserIsReady = true;
                }
            });

            const readyBtn = document.getElementById('readyBtn');
            if (readyBtn) {
                readyBtn.disabled = currentUserIsReady;
                if (currentUserIsReady) {
                    readyBtn.textContent = 'Ready!';
                }
            }
        }

        function selectTeam(team) {
            // Generate unique session-based username
            const timestamp = Date.now();
            const username = 'Player_' + timestamp;
            
            fetch('game_controller.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: 'join',
                    username: username,
                    team: team
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.text();
            })
            .then(text => {
                console.log('Join response:', text);
                const data = JSON.parse(text);
                if (data.success) {
                    currentUser = {
                        id: data.user_id,
                        team: data.team,
                        username: data.username || username
                    };
                    
                    document.getElementById('teamSelection').style.display = 'none';
                    document.getElementById('waitingArea').style.display = 'block';
                    
                    // Start SSE connection
                    startSSE();
                } else {
                    alert('Takıma katılırken hata: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Bağlantı hatası! ' + error.message);
            });
        }

        function setReady() {
            fetch('game_controller.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: 'set_ready',
                    user_id: currentUser.id
                })
            })
            .then(response => response.json())
            .then(data => {
                if (!data.success) {
                    alert('Error setting ready status: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        function startGame() {
            gameState = 'playing';
            document.getElementById('waitingArea').style.display = 'none';
            document.getElementById('gameArea').style.display = 'block';
            displayQuestion();
            startTimer();
        }

        function displayQuestion() {
            selectedAnswer = null;
            const questionArea = document.getElementById('questionArea');
            if (!currentGame || !currentGame.question) {
                questionArea.innerHTML = '<p>Soru yükleniyor...</p>';
                return;
            }

            const isCurrentTeam = (currentGame.current_team === currentUser.team);
            
            const teamUsers = currentGame.users.filter(u => u.team === currentUser.team);
            userPosition = teamUsers.findIndex(u => u.id === currentUser.id);
            
            let content = '';
            let shouldShowOptions = false;
            
            if (isCurrentTeam) {
                const currentQuestionNum = parseInt(currentGame.current_question_id, 10);
                const userPos = parseInt(userPosition, 10);
                const shouldShowQuestion = (userPos + currentQuestionNum) % 2 === 0;
                
                if (shouldShowQuestion) {
                    // Show question only
                    content = `
                        <h3>SORU (Takım ${currentUser.team})</h3>
                        <div class="question">${currentGame.question}</div>
                        <p style="text-align: center; color: #666; font-style: italic; margin-top: 20px;">
                            🤝 Takım arkadaşınız seçenekleri görebiliyor. Birlikte karar verin!
                        </p>
                    `;
                } else {
                    shouldShowOptions = true;
                    // Show options only
                    content = `
                        <h3>SEÇENEKLER (Takım ${currentUser.team})</h3>
                        <p style="text-align: center; color: #666; font-style: italic; margin-bottom: 20px;">
                            🤝 Takım arkadaşınız soruyu görebiliyor. Birlikte karar verin!
                        </p>
                        <div class="options">
                            ${currentGame.options.map((option, index) => 
                                `<div class="option" onclick="selectOption(this, '${option}')">${String.fromCharCode(65 + index)}) ${option}</div>`
                            ).join('')}
                        </div>
                    `;
                }
            } else {
                // Other team - sees both question and options but cannot answer
                content = `
                    <h3>👁️ RAKIP TAKIM SORUSU (Takım ${currentGame.current_team})</h3>
                    <div class="question">${currentGame.question}</div>
                    <div class="options">
                        ${currentGame.options.map((option, index) => 
                            `<div class="option" style="cursor: not-allowed; opacity: 0.6; background: #f5f5f5;">${String.fromCharCode(65 + index)}) ${option}</div>`
                        ).join('')}
                    </div>
                    <p style="text-align: center; color: #666; font-style: italic; margin-top: 20px;">
                        👀 Rakip takımın sorusunu izliyorsunuz...
                    </p>
                `;
            }
            
            questionArea.innerHTML = content;
            
            document.getElementById('teamAScore').textContent = currentGame.team_a_score;
            document.getElementById('teamBScore').textContent = currentGame.team_b_score;
            document.getElementById('currentTeamIndicator').textContent = `🎯 Sıra: Takım ${currentGame.current_team}`;

            const submitBtn = document.getElementById('submitAnswerBtn');
            if (isCurrentTeam && shouldShowOptions) {
                submitBtn.style.display = 'inline-block';
            } else {
                submitBtn.style.display = 'none';
            }
        }

        function selectOption(optionDiv, answer) {
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.classList.remove('selected'));
            optionDiv.classList.add('selected');
            selectedAnswer = answer;
        }

        function submitAnswer() {
            if (!selectedAnswer) {
                alert('Lütfen bir cevap seçin!');
                return;
            }

            fetch('game_controller.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: 'submit_answer',
                    game_id: currentGame.id,
                    question_id: currentGame.current_question_id,
                    team: currentUser.team,
                    user_id: currentUser.id,
                    answer: selectedAnswer
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const options = document.querySelectorAll('.option');
                    options.forEach(opt => {
                        opt.style.pointerEvents = 'none';
                    });
                    document.getElementById('submitAnswerBtn').style.display = 'none';
                } else {
                    alert('Cevap gönderilirken hata oluştu: ' + data.error);
                }
            })
            .catch(error => {
                console.error('Error submitting answer:', error);
            });
        }

        function showCorrectAnswer() {
            clearInterval(timerInterval);
            
            const options = document.querySelectorAll('.option');
            options.forEach(opt => {
                const optionText = opt.textContent.substring(3);
                if (optionText === currentGame.correct_answer) {
                    opt.classList.add('correct');
                } else if (opt.classList.contains('selected')) {
                    opt.classList.add('incorrect');
                }
            });
            
            setTimeout(nextQuestion, 7000);
        }

        function nextQuestion() {
            fetch('game_controller.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: 'next_question',
                    game_id: currentGame.id
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.game_ended) {
                    endGame();
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        }

        function startTimer() {
            timeRemaining = 60;
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();
                
                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                }
            }, 1000);
        }

        function updateTimer(remaining) {
            timeRemaining = remaining;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            document.getElementById('timer').textContent = timeRemaining;
        }

        function endGame() {
            gameState = 'finished';
            clearInterval(timerInterval);
            
            document.getElementById('gameArea').style.display = 'none';
            document.getElementById('gameFinished').style.display = 'block';
            
            const teamAScore = currentGame.team_a_score;
            const teamBScore = currentGame.team_b_score;
            
            let winner = '';
            if (teamAScore > teamBScore) {
                winner = 'TAKIM A KAZANDI! 🎉';
            } else if (teamBScore > teamAScore) {
                winner = 'TAKIM B KAZANDI! 🎉';
            } else {
                winner = 'BERABERE! 🤝';
            }
            
            document.getElementById('winnerText').textContent = winner;
            document.getElementById('finalScoreA').textContent = `Takım A: ${teamAScore}`;
            document.getElementById('finalScoreB').textContent = `Takım B: ${teamBScore}`;
        }

        function resetGame() {
            if (confirm('Oyunu sıfırlamak istediğinizden emin misiniz?')) {
                fetch('game_controller.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        action: 'reset_game'
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        location.reload();
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Get initial team counts when page loads
            fetch('game_controller.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    action: 'get_state'
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.game) {
                    updateTeamCounts(data.teams, data.ready_player_count);
                    updatePlayerList(data.game.users);
                } else {
                    updateTeamCounts(data.teams, 0);
                    updatePlayerList([]);
                }
            })
            .catch(error => {
                console.log('Initial state load error:', error);
            });
        });
    </script>
</body>
</html>
