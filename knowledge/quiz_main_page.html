<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Yarışması</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 90%;
            margin: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .team-selection {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .team-button {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .team-a {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            color: white;
        }

        .team-b {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
            color: white;
        }

        .team-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .team-button:active {
            transform: translateY(0);
        }

        .game-area {
            display: none;
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(45deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
        }

        .team-info {
            text-align: center;
        }

        .team-name {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .team-score {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .timer {
            font-size: 3em;
            font-weight: bold;
            color: #e74c3c;
            text-align: center;
            animation: pulse 1s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .question-area {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            min-height: 300px;
        }

        .question {
            font-size: 1.4em;
            font-weight: bold;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .option {
            padding: 15px 20px;
            border: 2px solid #ddd;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            text-align: center;
        }

        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-1px);
        }

        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .option.correct {
            background: #27ae60;
            color: white;
            border-color: #27ae60;
        }

        .option.incorrect {
            background: #e74c3c;
            color: white;
            border-color: #e74c3c;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #95a5a6, #7f8c8d);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .waiting {
            text-align: center;
            padding: 40px;
        }

        .waiting h2 {
            color: #667eea;
            margin-bottom: 20px;
        }

        .player-list {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }

        .team-list {
            flex: 1;
            margin: 0 20px;
        }

        .team-list h3 {
            text-align: center;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            color: white;
        }

        .team-list.team-a h3 {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
        }

        .team-list.team-b h3 {
            background: linear-gradient(45deg, #4ecdc4, #44a08d);
        }

        .player {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 5px;
            margin: 5px 0;
            text-align: center;
        }

        .game-finished {
            text-align: center;
            padding: 40px;
        }

        .winner {
            font-size: 2.5em;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 20px;
        }

        .final-scores {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }

        .final-score {
            font-size: 1.5em;
            padding: 20px;
            border-radius: 10px;
            background: #f8f9fa;
        }

        .username-input {
            margin-bottom: 20px;
            text-align: center;
        }

            padding:
